<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odbierz swój rabat!</title>
    <style>
        /* Prosty reset i nowoczesna czcionka */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Główna karta dopasowana do ekranu telefonu */
        .container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 30px 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        p {
            font-size: 15px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Sekcja z kodem rabatowym */
        .promo-box {
            background-color: #f0fdf4; /* Delikatny zielony token */
            border: 2px dashed #4ade80;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .promo-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #166534;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .promo-code {
            font-size: 28px;
            font-weight: 800;
            color: #16a34a;
            letter-spacing: 2px;
        }

        .notice {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }

        /* Przycisk akcji pod SEO i opinie */
        .btn {
            display: block;
            background-color: #2563eb; /* Elegancki niebieski */
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: background-color 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🎁</div>
        <h1>Dziękujemy za wizytę!</h1>
        <p>Doceniamy, że korzystasz z naszych usług. W podziękowaniu przygotowaliśmy dla Ciebie zniżkę na kolejną wizytę.</p>
        
        <!-- Okienko z kodem -->
        <div class="promo-box">
            <div class="promo-label">Twój kod rabatowy</div>
            <div class="promo-code">ZUR10</div> 
            <div class="notice">Zrób zrzut ekranu lub pokaż ten kod przy następnej wizycie</div>
        </div>

        <!-- Przycisk podbijający SEO / zaangażowanie -->
        <a href="https://g.page/r/TWÓJ_LINK_DO_OPINII_GOOGLE/review" target="_blank" class="btn">
            Zostaw opinię w Google ⭐
        </a>

        <div class="footer">
            &copy; 2026 Kluczserw Częstochowa
        </div>
    </div>

</body>
</html>
